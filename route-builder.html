<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Road & Ride — Route Builder</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #94a3b8;
      --accent: #e47c34;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    header .brand {
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    header .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button,
    .btn {
      appearance: none;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #111827;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.ghost {
      background: transparent;
      border-color: #e5e7eb;
      color: #111827;
    }

    #wrap {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      min-height: calc(100dvh - 56px);
    }

    #sidebar {
      border-right: 1px solid #e5e7eb;
      padding: 12px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    #map {
      height: calc(100dvh - 56px);
      width: 100%;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #ffffff;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input,
    textarea,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed #e5e7eb;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .hr {
      height: 1px;
      background: #e5e7eb;
      margin: 8px 0;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .leaflet-container {
      filter: grayscale(100%) contrast(1.1) brightness(1.15);
    }

    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none;
    }

    .route-line {
      stroke: var(--accent) !important;
      stroke-width: 3px !important;
    }

    #points {
      margin: 8px 0 0 18px;
      padding-left: 0;
    }

    #points li {
      font-size: 0.85rem;
      color: #1f2937;
    }

    @media (max-width: 960px) {
      #wrap {
        grid-template-columns: 1fr;
      }

      #sidebar {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
        flex-direction: row;
        flex-wrap: wrap;
      }

      #sidebar .card {
        flex: 1 1 280px;
      }

      #map {
        height: 60vh;
      }
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha512-o9N1jH+3r0pJIUKGwEuITTwSb9VjA36TObgGJE0E7E5Wdl66iRS0LlwM651c01qmPvvrL1jAUx0xGfLlr3rGQw==" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha512-Wyn36GZ8V+8mQpAO6QW2LaxhUJW6QcgO5Kb/6VQwWi4KFOeFHrgb3R04QLbTjaCj1eO0MJ0GJtG8skhNf38B0w==" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@tmcw/togpx@0.5.5/togpx.js"></script>
</head>
<body>
  <header>
    <div class="brand">Road & Ride — Route Builder</div>
    <div class="actions">
      <button class="ghost" id="btnLogin">Войти</button>
      <button class="ghost" id="btnLogout" style="display:none">Выйти</button>
      <button class="primary" id="btnPublish" title="Скоро">Опубликовать</button>
    </div>
  </header>
  <div id="wrap">
    <aside id="sidebar">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <h3 style="margin:0;font-size:1.05rem">Saarburg → Trier</h3>
          <span class="pill">Minimal</span>
        </div>
        <div class="muted">~55–65 км · 2.5–3 ч</div>
        <div class="hr"></div>
        <label class="hint" for="desc">Описание:</label>
        <textarea id="desc" class="input" rows="5" placeholder="Ключевые точки: Saarburg → Nittel → Konz → Oberemmel → Trier"></textarea>
      </div>

      <div class="card">
        <div class="row">
          <button id="btnDraw" class="btn">✏ Нарисовать</button>
          <button id="btnEdit" class="btn">✂ Править</button>
          <button id="btnDelete" class="btn">🗑 Очистить</button>
        </div>
        <div class="hr"></div>
        <div class="row">
          <button id="btnSnap" class="btn">🧲 Привязать к дороге</button>
          <button id="btnSimplify" class="btn">🪄 Упростить</button>
        </div>
        <div class="hr"></div>
        <div class="row">
          <button id="btnExportGeoJSON" class="btn">⬇ GeoJSON</button>
          <button id="btnExportGPX" class="btn">⬇ GPX</button>
        </div>
        <p class="hint">Snap использует публичный OSRM (демо). Привязка может быть недоступна из-за лимитов.</p>
      </div>

      <div class="card">
        <span class="muted">Точки маршрута:</span>
        <ol id="points" class="list"></ol>
      </div>
    </aside>
    <main>
      <div id="map"></div>
    </main>
  </div>

  <script>
    const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([49.693, 6.539], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 16, opacity: 0.30 }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      draw: {
        polygon:false,
        rectangle:false,
        circle:false,
        marker:false,
        circlemarker:false,
        polyline: {
          shapeOptions: {
            color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),
            weight: 4,
            opacity: 0.95,
            className:'route-line'
          }
        }
      },
      edit: { featureGroup: drawnItems, remove:false }
    });
    map.addControl(drawControl);

    let currentLine = null;

    map.on(L.Draw.Event.CREATED, function (e) {
      if (e.layerType === 'polyline') {
        if (currentLine) drawnItems.removeLayer(currentLine);
        currentLine = e.layer;
        drawnItems.addLayer(currentLine);
        fitToLine();
        refreshPointsList();
      }
    });

    map.on('draw:edited', refreshPointsList);

    function fitToLine(){
      if(currentLine){
        map.fitBounds(currentLine.getBounds(), {padding:[40,40]});
      }
    }

    function refreshPointsList(){
      const list = document.getElementById('points');
      list.innerHTML = '';
      if(!currentLine) return;
      currentLine.getLatLngs().forEach((ll,idx)=>{
        const li = document.createElement('li');
        li.textContent = `${String(idx+1).padStart(2,'0')} · ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
        list.appendChild(li);
      });
    }

    const btnDraw = document.getElementById('btnDraw');
    const btnEdit = document.getElementById('btnEdit');
    const btnDelete = document.getElementById('btnDelete');
    const btnSimplify = document.getElementById('btnSimplify');
    const btnSnap = document.getElementById('btnSnap');
    const btnExportGeoJSON = document.getElementById('btnExportGeoJSON');
    const btnExportGPX = document.getElementById('btnExportGPX');
    const btnPublish = document.getElementById('btnPublish');

    btnDraw.onclick = () => new L.Draw.Polyline(map, drawControl.options.draw.polyline).enable();
    btnEdit.onclick = () => new L.EditToolbar.Edit(map, { featureGroup: drawnItems }).enable();
    btnDelete.onclick = () => {
      if(currentLine){
        drawnItems.removeLayer(currentLine);
        currentLine=null;
        refreshPointsList();
      }
    };

    btnSimplify.onclick = () => {
      if(!currentLine) return;
      const tol = 0.0005;
      const simp = L.LineUtil.simplify(currentLine.getLatLngs().map(ll=>L.point(ll.lng, ll.lat)), tol)
                     .map(p=>L.latLng(p.y, p.x));
      currentLine.setLatLngs(simp);
      refreshPointsList();
    };

    btnSnap.onclick = async () => {
      if(!currentLine) return;
      const coords = currentLine.getLatLngs().map(ll=>`${ll.lng},${ll.lat}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&alternatives=false`;
      try{
        const res = await fetch(url);
        const data = await res.json();
        if(data && data.routes && data.routes[0]){
          const g = data.routes[0].geometry.coordinates.map(([lng,lat])=>L.latLng(lat,lng));
          currentLine.setLatLngs(g);
          fitToLine();
          refreshPointsList();
        }
      }catch(err){
        console.warn('OSRM недоступен', err);
      }
    };

    function lineToGeoJSON(){
      if(!currentLine) return null;
      return currentLine.toGeoJSON();
    }

    btnExportGeoJSON.onclick = () => {
      const gj = lineToGeoJSON(); if(!gj) return;
      const blob = new Blob([JSON.stringify(gj, null, 2)], {type:'application/json'});
      downloadBlob(blob, 'route.geojson');
    };

    btnExportGPX.onclick = () => {
      const gj = lineToGeoJSON(); if(!gj) return;
      const gpx = toGPX({ type:'FeatureCollection', features:[gj] }, { creator:'Road&Ride' });
      const blob = new Blob([gpx], {type:'application/gpx+xml'});
      downloadBlob(blob, 'route.gpx');
    };

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }

    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    let currentUser = null;

    btnLogin.onclick = () => {
      alert('Здесь позже появится окно входа.');
      currentUser = { email:'demo@user' };
      syncAuthUI();
    };

    btnLogout.onclick = () => {
      currentUser = null;
      syncAuthUI();
    };

    function syncAuthUI(){
      btnLogin.style.display = currentUser ? 'none' : 'inline-flex';
      btnLogout.style.display = currentUser ? 'inline-flex' : 'none';
    }

    btnPublish.onclick = () => {
      alert('Публикация будет реализована позже. Экспортируйте GPX/GeoJSON и добавьте маршрут вручную.');
    };
  </script>
</body>
</html>
